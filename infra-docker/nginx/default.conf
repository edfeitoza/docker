server {
    listen 80;
    server_name _;
    root /var/www/html;              # ./www no host
    index index.php index.html;

    client_max_body_size 50M;
    server_tokens off;

    # Cada aplicação fica em uma subpasta: http://localhost:8080/<app>/
    location / {
        try_files $uri $uri/ =404;
    }

    # phpinfo: acesso apenas de redes privadas (remover em produção)
    location = /phpinfo.php {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloqueia arquivos ocultos (.env, .git, .htaccess)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
